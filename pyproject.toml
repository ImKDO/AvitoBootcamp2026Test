[project]
name = "avito-candgen"
version = "0.1.0"
description = "Кандидатогенерация для поиска услуг Авито (Recall@50)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pystemmer>=3.1.0",
    "lightgbm>=4.7.0",
    "sentence-transformers>=5",
    "torch>=2.14.0",
]

[project.scripts]
avito-cv = "avito_candgen.cli:cv"
avito-predict = "avito_candgen.cli:predict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avito_candgen"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
